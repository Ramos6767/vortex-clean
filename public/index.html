<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VORTEX AI</title>

  <link rel="stylesheet" href="style.css"/>

</head>
<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="logo">
      <img src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png">
      <h1>VORTEX</h1>
    </div>

    <button class="new-chat" onclick="newChat()">
      + Nova conversa
    </button>

    <input
      type="text"
      class="search"
      placeholder="Buscar conversa..."
    />

    <div class="section-title">
      Conversas
    </div>

    <div class="chat-list" id="chatList">

    </div>

    <div class="user-box">

      <div class="user-left">

        <div class="avatar">
          G
        </div>

        <div>
          <strong>Gabriel</strong>
          <p style="font-size:12px;color:#9ca3af;">
            Plano Free
          </p>
        </div>

      </div>

      <button
        onclick="logout()"
        style="
        background:none;
        border:none;
        color:white;
        cursor:pointer;
        "
      >
        Sair
      </button>

    </div>

  </aside>

  <!-- MAIN -->

  <main class="main">

    <!-- TOPBAR -->

    <header class="topbar">

      <div class="top-left">

        <button class="menu-btn">
          ☰
        </button>

        <div class="chat-title">
          <h2>VORTEX Chat</h2>
          <div class="online">
            ● Online
          </div>
        </div>

      </div>

    </header>

    <!-- CHAT -->

    <div class="chat-container" id="chatContainer">

    </div>

    <!-- INPUT -->

    <div class="chat-input">

      <input
        type="text"
        id="messageInput"
        placeholder="Digite sua mensagem..."
      />

      <button
        class="send-btn"
        onclick="sendMessage()"
      >
        ➤
      </button>

    </div>

  </main>

</div>

<script src="app.js"></script>

</body>
</html>
