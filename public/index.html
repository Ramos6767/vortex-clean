<!-- public/index.html -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Vortex AI</title>

  <link rel="stylesheet" href="style.css"/>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<div class="app">

  <aside class="sidebar">

    <div class="logo">
      VORTEX
    </div>

    <button id="newChatBtn" class="new-chat">
      + Nova conversa
    </button>

    <div id="chatList" class="chat-list"></div>

  </aside>

  <main class="main">

    <header class="topbar">

      <div class="user-box">
        <div class="avatar" id="avatar">
          G
        </div>

        <div class="user-info">
          <h3 id="userName">Gabriel</h3>
          <span>Online</span>
        </div>
      </div>

    </header>

    <section id="messages" class="messages">

      <div class="welcome">

        <h1>Vortex AI</h1>

        <p>
          Sua IA futurista inteligente.
        </p>

      </div>

    </section>

    <form id="form" class="chat-form">

      <input
        type="text"
        id="input"
        placeholder="Digite sua mensagem..."
        autocomplete="off"
      />

      <label class="upload-btn">
        📎
        <input type="file" id="fileInput" hidden />
      </label>

      <button type="button" class="mic">
        🎙
      </button>

      <button type="button" class="stop-btn" id="stopBtn">
        ■
      </button>

      <button class="send" type="submit">
        ➤
      </button>

    </form>

  </main>

</div>

<script src="app.js"></script>

</body>
</html>
