<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vortex Chat</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">🌀</div>
      <h1>VORTEX AI</h1>
      <button id="closeMenu">×</button>
    </div>

    <button class="new-chat" id="newChat">
      <span>＋</span>
      Nova conversa
    </button>

    <div class="search">
      <span>⌕</span>
      <input id="searchHistory" placeholder="Buscar conversas...">
    </div>

    <h3 class="side-title">Conversas</h3>

    <div class="history" id="history"></div>

    <div class="user-card">
      <div class="user-avatar" id="profileAvatar">G</div>
      <div>
        <strong id="profileName">Gabriel</strong>
        <small>Free</small>
      </div>
      <button id="logoutBtn">⌄</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button id="openMenu">☰</button>

      <div class="top-title">
        <h2>VORTEX Chat</h2>
        <span>● Online</span>
      </div>

      <div class="top-actions">
        <button id="exportBtn">⇩</button>
        <button id="themeBtn">☼</button>
        <button class="avatar" id="avatar">G</button>
      </div>
    </header>

    <section class="chat-area" id="chatArea">
      <div class="date-pill">24 de maio de 2026</div>

      <div class="empty-state" id="emptyState">
        <div class="empty-logo">🌀</div>
        <h1>Olá, <span id="helloName">Gabriel</span>! 👋</h1>
        <p>Como posso te ajudar hoje?</p>

        <div class="suggestions">
          <button data-prompt="Crie um código HTML, CSS e JavaScript moderno.">💻 Criar código</button>
          <button data-prompt="Explique esse assunto de forma simples.">📚 Explicar</button>
          <button data-prompt="Me dê ideias para meu projeto.">⚡ Ideias</button>
          <button data-prompt="Resuma este texto.">📝 Resumir</button>
        </div>
      </div>

      <div class="chat" id="chat"></div>
    </section>

    <div class="file-preview" id="filePreview"></div>

    <form id="form" class="composer">
      <button type="button" class="attach" id="fileBtn">📎</button>

      <input type="file" id="fileInput" hidden accept=".txt,.pdf,.docx,.js,.html,.css,.json,.md">

      <input id="input" placeholder="Digite sua mensagem..." autocomplete="off">

      <button type="button" class="stop-btn" id="stopBtn">■</button>

      <button class="send" type="submit">➤</button>
    </form>
  </main>

  <div class="theme-modal" id="themeModal">
    <div class="theme-box">
      <div class="theme-head">
        <h3>Escolha a cor</h3>
        <button id="closeTheme">×</button>
      </div>

      <div class="theme-grid">
        <button data-theme="purple">🟣 Roxo</button>
        <button data-theme="blue">🔵 Azul</button>
        <button data-theme="green">🟢 Verde</button>
        <button data-theme="red">🔴 Vermelho</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
