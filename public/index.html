<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>VORTEX AI</title>

  <link rel="stylesheet" href="/style.css" />
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#7c3aed">
</head>

<body>
  <div class="app">

    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <div class="logo-icon">🌀</div>
        <h1>VORTEX</h1>
      </div>

      <button class="new-chat" onclick="newChat()">
        + Nova conversa
      </button>

      <input
        type="text"
        class="search"
        id="searchInput"
        placeholder="Buscar conversa..."
      />

      <div class="section-title">Conversas</div>

      <div class="chat-list" id="chatList"></div>

      <div class="user-box">
        <div class="user-left">
          <div class="avatar" id="userAvatar">G</div>

          <div>
            <strong id="userName">Gabriel</strong>
            <p>Plano Free</p>
          </div>
        </div>

        <button class="logout-btn" onclick="logout()">Sair</button>
      </div>
    </aside>

    <main class="main">

      <header class="topbar">

        <div class="top-left">
          <button class="menu-btn" onclick="toggleSidebar()">☰</button>

          <div class="chat-title">
            <h2>VORTEX Chat</h2>
            <div class="online">● Online</div>
          </div>
        </div>

        <button class="settings-btn" onclick="openSettings()">
          ⚙️
        </button>

      </header>

      <div class="chat-container" id="chatContainer"></div>

      <div class="file-preview" id="filePreview"></div>

      <div class="chat-input">

        <button
          class="attach-btn"
          onclick="document.getElementById('fileInput').click()"
        >
          📎
        </button>

        <button
          class="mic-btn"
          onclick="startVoice()"
        >
          🎤
        </button>

        <input
          type="file"
          id="fileInput"
          hidden
          accept=".txt,.pdf,.docx,.js,.html,.css,.json,.md"
        />

        <input
          type="text"
          id="messageInput"
          placeholder="Digite sua mensagem..."
        />

        <button
          class="send-btn"
          onclick="sendMessage()"
        >
          ➤
        </button>

      </div>

    </main>

  </div>

  <div class="settings-modal" id="settingsModal">

    <div class="settings-box">

      <h2>⚙️ Configurações</h2>

      <button onclick="setTheme('dark')">
        🌙 Modo Escuro
      </button>

      <button onclick="setTheme('light')">
        ☀️ Modo Claro
      </button>

      <button onclick="closeSettings()">
        Fechar
      </button>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script src="/app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {

      navigator.serviceWorker
        .register("/service-worker.js")
        .then(() => {
          console.log("PWA ativo");
        })
        .catch(err => {
          console.error("Erro PWA:", err);
        });

    }
  </script>

</body>
</html>
