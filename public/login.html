<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Vortex</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>

  <div class="login-card">
    <div class="logo">🌀</div>

    <h1>VORTEX</h1>
    <p>Sua IA futurista avançada</p>

    <div id="registerFields" class="hidden">
      <input id="name" type="text" placeholder="Seu nome" />
    </div>

    <input id="email" type="email" placeholder="Seu Gmail" />
    <input id="password" type="password" placeholder="Sua senha" />

    <button id="submitBtn">Entrar</button>

    <p class="switch">
      <span id="switchText">Não tem conta?</span>
      <button id="switchBtn">Cadastrar</button>
    </p>
  </div>

  <script src="login.js"></script>
</body>
</html>
